# Manual iOS-simulator boot check (TB-16; follow-up from TB-15).
# Manual only: macOS runner minutes cost more than Linux minutes, so this never runs on PRs.
# Run it from the Actions tab ("Run workflow") before a release or after native dependency changes.
# Release configuration embeds the JS bundle, so no Metro server is needed on the runner.
name: iOS simulator boot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    name: ios-simulator
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios

      - name: Build for simulator
        run: |
          xcodebuild \
            -workspace ios/TaskBuddy.xcworkspace \
            -scheme TaskBuddy \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator, install and launch
        run: |
          DEVICE=$(xcrun simctl list devices available -j | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);const all=Object.values(j.devices).flat().filter(x=>x.name.startsWith("iPhone"));console.log(all[0].udid)})')
          xcrun simctl boot "$DEVICE"
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.codeex24.taskbuddy
          sleep 20
          xcrun simctl io "$DEVICE" screenshot ios-simulator.png

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: ios-simulator.png
