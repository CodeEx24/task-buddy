# TB-22 (https://stratyge.atlassian.net/browse/TB-22): proposed CI job for .github/workflows/ci.yml.
# Agents can't edit workflow files, so the owner pastes this block under `jobs:` (see
# docs/actions/ci-deno-check.md). It type-checks the Edge Function the way the Edge Runtime sees it
# (Deno globals, npm: specifiers, deno.json import map). Unit tests already run in the `ci` job
# (Jest project `edge-functions`). No secrets.

  edge-functions:
    name: edge-functions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Same Deno minor as the Supabase Edge Runtime (1.77.x ships Deno 2.1.4).
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - name: Deno type check (ai-gateway)
        run: deno check --no-lock --config supabase/functions/ai-gateway/deno.json supabase/functions/ai-gateway/index.ts
